[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "roadsense-desktop"
version = "0.1.0"
description = "RoadSense Desktop — USB-serial road-condition monitor for the car-in-a-box prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pyserial>=3.5",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.gui-scripts]
roadsense = "roadsense.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
