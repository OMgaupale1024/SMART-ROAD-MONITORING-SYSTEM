[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "roadsense"
version = "2.0.0.dev0"
description = "RoadSense: edge-AI driving assistance and road-hazard monitoring (Webots digital twin, Raspberry Pi edge processor, live dashboard)"
readme = "README.md"
requires-python = ">=3.10"
# roadsense.autonomy is standard library only (Webots runs it with its own Python 3.9, straight from src/).
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.141",  # brings pydantic, which validates the sensor frames
    "uvicorn>=0.52",
    "websockets>=16",  # uvicorn's WebSocket backend for /ws/live
]
vision = [
    "ultralytics>=8.3",  # YOLO detection + NCNN export for tools/bench_detector.py; pulls in PyTorch and OpenCV
]
dev = [
    "pytest>=7.0",
    "httpx2>=2.0",  # what Starlette's (and so FastAPI's) TestClient uses
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"roadsense.web" = ["static/**/*"]  # the dashboard, with its vendored three.js: no internet needed
"roadsense.experimental" = ["calibration.json"]  # shadow perception slack tables (development calibration)

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]  # the archived Arduino stack has its own: python -m pytest legacy/arduino/tests
